services:
  - type: web
    name: unibox-mvp-startup
    runtime: node
    buildCommand: ""
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
    disk:
      name: unibox-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
